; Se carga después de www.conf y zz-docker.conf (orden alfabético).
[www]
; Solo Nginx (mismo contenedor) puede hablar con FPM
listen = 127.0.0.1:9000

; Pasar las variables de entorno del contenedor a PHP
clear_env = no

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
