; OPcache para producción: el código no cambia dentro de la imagen, así que no
; se revisan timestamps de archivos en cada petición.
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0

; No exponer la versión de PHP en las cabeceras
expose_php=Off
